# Tema de la interfaz (src/app/serve.py).
#
# Los valores salen del sistema de diseno "Feature Viz". El criterio de fondo:
# la pantalla ya esta llena de color que no elegimos nosotros (fotos de
# plantas, mapas de calor en inferno, patrones optimizados), asi que el cromo
# se aparta: superficies neutras de croma baja y un solo acento.
#
# Esto NO toca serve.py. Streamlit lee este fichero al arrancar.

[theme]
# Radios cortos: es un instrumento de medida, no una aplicacion de consumo.
baseRadius = "6px"              # radius-md
buttonRadius = "6px"
showWidgetBorder = true
showSidebarBorder = true

# Pilas del sistema, sin descargar ninguna fuente: la aplicacion tiene que
# arrancar igual sin red.
font = "sans-serif"
codeFont = "monospace"

# -------------------------------------------------------------------- claro
[theme.light]
backgroundColor = "#fbfbf9"           # surface
secondaryBackgroundColor = "#f1f1ec"  # surface-raised: barra lateral y tarjetas
textColor = "#1b1c19"                 # ink
primaryColor = "#0f6f5c"              # accent: boton Generar, deslizadores
linkColor = "#0f6f5c"
borderColor = "#dddcd3"               # border
codeBackgroundColor = "#e7e7e0"       # surface-sunken
dataframeBorderColor = "#dddcd3"

# Los dos colores de senal del sistema, para que :orange[] y :blue[] y las
# alertas usen los del proyecto. Ambar = activacion positiva (coincide con el
# extremo claro del inferno), azul = negativa. No verde/rojo: ese par no se
# distingue sin percibir el color.
orangeColor = "#8c4500"               # signal-positivo
blueColor = "#1f4e8c"                 # signal-negativo
yellowColor = "#7a4e00"               # signal-aviso

# ------------------------------------------------------------------ oscuro
[theme.dark]
backgroundColor = "#141513"
secondaryBackgroundColor = "#1e201c"
textColor = "#edefe9"
# OJO: aqui NO va el acento claro del sistema (#3ebd9d). Streamlit pinta el
# texto del boton primario en blanco y no deja cambiarlo, asi que el
# primaryColor tiene que ser lo bastante oscuro para que el blanco se lea
# encima. #157f69 da 4.9:1 con blanco y 3.8:1 contra el fondo.
primaryColor = "#157f69"
linkColor = "#3ebd9d"                 # accent del tema oscuro: aqui si, es texto
borderColor = "#2e312c"
codeBackgroundColor = "#0e0f0d"
dataframeBorderColor = "#2e312c"

orangeColor = "#e0953f"
blueColor = "#78aee6"
yellowColor = "#d7a53f"

[theme.dark.sidebar]
# El acento oscuro de arriba es el que necesita el BOTON, porque Streamlit le
# pone el texto en blanco. Pero ese mismo color es el que pinta las cifras de
# los deslizadores, que son texto pequeño: sobre la barra lateral daba 3.35:1.
# Aqui no hay ningun boton primario, asi que la barra lateral usa el acento
# claro del sistema (#3ebd9d, accent del tema oscuro) y las cifras se leen.
primaryColor = "#3ebd9d"
